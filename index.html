<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイ献立アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ① 未ログイン時：ログイン画面 -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h2 class="login-title">🍳 マイ献立アプリ</h2>
      <p class="login-subtitle">ログインしてクラウドと同期します</p>
      
      <div class="login-group">
        <label for="auth-email">メールアドレス</label>
        <input type="email" id="auth-email" placeholder="example@mail.com">
      </div>
      
      <div class="login-group">
        <label for="auth-password">パスワード (6文字以上)</label>
        <input type="password" id="auth-password" placeholder="••••••">
      </div>
      
      <button class="btn login-btn" id="btn-login">ログイン / 新規登録</button>
    </div>
  </div>

  <!-- ② ログイン済：アプリ本体 -->
  <div id="app-wrapper" class="app-wrapper">
    
    <!-- 上部タブナビゲーション -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-target="page-register">レシピ<br class="sp">登録</button>
      <button class="tab-btn" data-target="page-list">レシピ<br class="sp">一覧</button>
      <button class="tab-btn" data-target="page-menu">1週間の<br class="sp">献立</button>
      <button class="tab-btn" data-target="page-shopping">買い物<br class="sp">リスト</button>
      <button class="tab-btn" data-target="page-settings">設定</button>
    </nav>

    <!-- メインコンテンツ表示部分 -->
        <main class="main-content-area">
      
      <!-- 1. レシピ登録ページ -->
      <div id="page-register" class="page-view active">
        <h3 class="section-title">新しいレシピを追加する</h3>
        <div class="form-group"><label>レシピ名</label><input type="text" id="in-title" placeholder="例：オムライス"></div>
        <div class="form-group"><label>カテゴリ</label><select id="in-cat"><option>主菜</option><option>副菜</option><option>汁物</option></select></div>
        <div class="form-group"><label>材料 (名前 分量、1行ずつ)</label><textarea id="in-ing" rows="8" placeholder="卵 2個
ご飯 1皿"></textarea></div>
        <div class="form-group"><label>下準備 (1行ずつ)</label><textarea id="in-prep" rows="3" placeholder="卵をよく混ぜておく"></textarea></div>
        <div class="form-group"><label>作り方 (1行ずつ)</label><textarea id="in-steps" rows="10" placeholder="ご飯を炒める
卵で包む"></textarea></div>
        <div class="form-group"><label>メモ (自由に記入)</label><textarea id="in-notes" rows="4" placeholder="例：食べた感想、代用できる調味料など"></textarea></div>
        <button class="btn primary-btn" id="save-btn">レシピを保存する</button>
        <p class="hint">既存のレシピを呼び出している場合、上書き保存されます</p>
      </div>

      <!-- 2. レシピ一覧ページ -->
      <div id="page-list" class="page-view">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="すべて">すべて</button>
          <button class="filter-btn" data-filter="主菜">主菜</button>
          <button class="filter-btn" data-filter="副菜">副菜</button>
          <button class="filter-btn" data-filter="汁物">汁物</button>
        </div>
        <div class="recipe-grid" id="recipe-grid"></div>
      </div>

      <!-- 3. カレンダーページ -->
      <div id="page-menu" class="page-view">
        <div class="calendar-page-header">
          <h3>1週間の献立</h3>
          <button type="button" class="btn btn-reset-calendar" id="clear-all-btn">今週の献立をリセット</button>
        </div>
        <p class="calendar-hint">レシピ名をタップすると詳細の確認ができます</p>
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>

      <!-- 4. 買い物リストページ -->
      <div id="page-shopping" class="page-view">
        <div class="shopping-header">
          <h3>買い物リスト</h3>
          <span class="shopping-note">※カレンダーの献立から自動集計</span>
        </div>
        <div class="card">
          <span class="shopping-hint">ここでリストへ個別で追加できます</span>
          <div class="memo-input-group">
            <input type="text" id="in-memo" class="memo-input" placeholder="例：グラノーラ">
            <button class="btn btn-add-memo" id="add-memo-btn">＋ 追加</button>
          </div>
        </div>
        <ul class="shopping-list" id="shopping-list-container"></ul>
      </div>

      <!-- 5. 設定ページ -->
      <div id="page-settings" class="page-view">
        <h3 class="settings-heading">⚙️ アプリ設定</h3>
        <!-- アカウント情報カード -->
        <div class="settings-card">
          <h4 class="settings-sub-title">👤 アカウント情報</h4>
          <p class="settings-email">ログイン中: <span id="user-display-email"></span></p>
          <button class="btn logout-btn" id="btn-logout">ログアウト</button>
        </div>
        <!-- カテゴリー管理カード -->
        <div class="settings-card">
          <h4 class="settings-sub-title">🏷️ レシピカテゴリーの編集</h4>
          <p class="settings-desc">新しいカテゴリーを追加したり、不要なものを削除できます。</p>
          <div class="cat-add-form">
            <input type="text" id="in-new-cat" placeholder="例：デザート">
            <button class="btn cat-add-btn" id="btn-add-cat">＋ 追加</button>
          </div>
          <ul class="cat-manage-list" id="cat-manage-list">
            <!-- JavaScriptでカテゴリー一覧がここに描画されます -->
          </ul>
        </div>
      </div>

    </main>

    <!-- 既存の <main> や設定ページの後ろに配置 -->
    <div id="recipe-modal" class="recipe-modal">
      <div class="recipe-modal-overlay" id="modal-overlay"></div>
      <div class="recipe-modal-content">
        <button type="button" class="modal-close-btn" id="modal-close-btn" title="閉じる">×</button>
        <div id="modal-body">
          <!-- JavaScriptでレシピの詳細とクイック登録バーがここに挿入 -->
        </div>
      </div>
    </div>

  </div><!-- /#app-wrapper -->

  <!-- トースト通知の表示エリア -->
  <div id="toast-container" class="toast-container"></div>

  <!-- JavaScriptファイル読み込み -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-init.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
  <script src="memo.js"></script>
  <script src="shopping.js"></script>
  <script src="edit.js"></script>

</body>
